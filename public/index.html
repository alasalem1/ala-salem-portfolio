/* Layout: airy blue canvas, glowing circuit-chip hero, white rounded panels, sticky glass header, navy footer. Motion: staged hero entrance, flowing circuit traces, scroll-linked reveals, tilt cards. */
:root {
  --bg: #f3f7ff;
  --bg-2: #e3edff;
  --surface: #ffffff;
  --surface-2: #f5f8ff;
  --fg: #0a1535;

  --line: #dbe5fa;

  --navy: #07122e;
  --navy-2: #0c2058;
  --ok: #17c964;
  --on-accent: #ffffff;
  --glass: rgba(243, 247, 255, .82);
  --grid: rgba(10, 71, 224, .17);
  --font-display: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-hand: "Caveat", "Segoe Script", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060d1f; --bg-2: #0a1633; --surface: #0e1a38; --surface-2: #112042;
    --fg: #eaf0ff; --muted: #9db0d8; --accent: #4a8bff; --accent-2: #6aa2ff;
    --accent-soft: #14284f; --line: #1d2f5a; --shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
    --navy: #040a1b; --glass: rgba(6, 13, 31, .82); --grid: rgba(106, 162, 255, .22); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #060d1f; --bg-2: #0a1633; --surface: #0e1a38; --surface-2: #112042;
  --fg: #eaf0ff; --muted: #9db0d8; --accent: #4a8bff; --accent-2: #6aa2ff;
  --accent-soft: #14284f; --line: #1d2f5a; --shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
  --navy: #040a1b; --glass: rgba(6, 13, 31, .82); --grid: rgba(106, 162, 255, .22); color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; margin: 0; overflow-x: hidden; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; text-decoration: none; }
svg { display: block; }
section[id], footer[id] { scroll-margin-top: 84px; }
.ico { width: 1.2em; height: 1.2em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; border-radius: 8px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 40; }

.wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 36px; padding-block: 0 48px; }

/* ---------- motion primitives ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes flow { to { stroke-dashoffset: -44; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
@keyframes breathe { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(23, 201, 100, .45); } 100% { box-shadow: 0 0 0 10px rgba(23, 201, 100, 0); } }
@keyframes draw { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
@keyframes shine { from { transform: translateX(-120%) skewX(-20deg); } to { transform: translateX(220%) skewX(-20deg); } }
.in { opacity: 0; animation: rise .8s cubic-bezier(.2, .7, .2, 1) forwards; animation-delay: calc(var(--d, 0) * 110ms + 80ms); }
html:not(.ready) .in { animation-play-state: paused; }
html:not(.ready) { overflow: hidden; }

@supports (animation-timeline: view()) {
  .rv { animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 38%; }
  .progress { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); height: 3px; z-index: 60; transform-origin: 0 50%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); animation: grow linear both; animation-timeline: scroll(root); }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
}

/* ---------- header ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); transition: box-shadow .25s ease, background .25s ease; }
@supports (backdrop-filter: blur(8px)) { .topbar { background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); } }

.nav a { padding: 8px 14px; border-radius: 999px; font: 600 13px var(--font-display); white-space: nowrap; transition: background .2s, color .2s; }
.nav a:hover { background: var(--accent-soft); }
.nav { position: relative; }
.nav a { position: relative; z-index: 1; }
.nav a.on { color: var(--on-accent); }
.nav a.on:hover { background: transparent; }
.pill { position: absolute; z-index: 0; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 8px 18px -8px var(--accent); transition: transform .5s cubic-bezier(.3, 1.25, .5, 1), width .5s cubic-bezier(.3, 1.25, .5, 1); pointer-events: none; }
.social { display: flex; gap: 6px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 0; background: transparent; color: inherit; cursor: pointer; font: inherit; transition: background .2s, transform .2s; }
.icon-btn:hover { background: var(--accent-soft); transform: translateY(-2px); }
.icon-btn .ico { width: 22px; height: 22px; }
#themeBtn .sun { display: none; }

:root[data-theme="dark"] #themeBtn .sun { display: block; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) #themeBtn .moon { display: none; }
  :root:not([data-theme="light"]) #themeBtn .sun { display: block; }
}
@media (max-width: 860px) { .nav { order: 3; width: 100%; overflow-x: auto; padding-bottom: 2px; } }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; background: radial-gradient(1000px 520px at 85% 20%, var(--bg-2), transparent 70%); }
.hero-art { position: absolute; right: 0; top: 10px; width: min(58%, 720px); height: calc(100% - 10px); pointer-events: none; transform: translate(calc(var(--mx, 0) * 12px), calc(var(--my, 0) * 9px)); transition: transform .25s ease-out; }
.hero-art > div, .hero-art svg { width: 100%; height: 100%; }
.chip-bob { animation: bob 7s ease-in-out infinite; transform-origin: 330px 290px; transform-box: view-box; }
.halo { animation: breathe 5s ease-in-out infinite; }
.tr-base { opacity: .3; }
.tr-flow { stroke-dasharray: 6 38; animation: flow 2.2s linear infinite; }
.hero-in { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 20px; padding-block: 36px 60px; }
.badge { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; color: var(--muted); box-shadow: var(--shadow); }
.badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: ping 1.8s ease-out infinite; }
h1 { font: 800 clamp(34px, 5.2vw, 56px)/1.08 var(--font-display); letter-spacing: -.02em; text-wrap: balance; margin-top: 24px; }
h1 em { font-style: normal; color: var(--accent); position: relative; white-space: nowrap; }
h1 em svg { position: absolute; left: 3%; bottom: -12px; width: 97%; height: 12px; overflow: visible; }
h1 em path { stroke: var(--accent-2); stroke-width: 3; fill: none; stroke-linecap: round; stroke-dasharray: 400; animation: draw 1.1s .9s ease-out both; }
.term { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; padding: 8px 14px; border-radius: 10px; background: var(--navy); color: #cfe0ff; font: 500 13px var(--font-mono); max-width: 100%; min-height: 36px; }
.term .pr { color: #4fd08a; }

.lead b { font-weight: 600; }
.cta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 26px; }
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 13px 22px; border-radius: 14px; font: 700 14px var(--font-display); border: 1px solid transparent; cursor: pointer; transition: transform .18s ease, box-shadow .18s ease; color: inherit; }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--on-accent); box-shadow: 0 12px 24px -10px var(--accent); }
.btn.primary::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .35), transparent); transform: translateX(-120%) skewX(-20deg); }
.btn.primary:hover::after { animation: shine .8s ease; }
.btn.ghost { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }
.btn.small { padding: 9px 16px; font-size: 12.5px; border-radius: 10px; }
.btn[disabled] { opacity: .65; cursor: progress; }
.stats { display: flex; flex-wrap: wrap; gap: 14px 0; margin-top: 32px; }
.stat { display: flex; align-items: center; gap: 12px; padding-right: 22px; margin-right: 22px; border-right: 1px solid var(--line); }
.stat:last-child { border: 0; margin: 0; padding: 0; }
.stat .ico { color: var(--accent); width: 24px; height: 24px; }
.stat b { display: block; font: 800 17px/1.1 var(--font-display); }
.stat span { font-size: 12px; color: var(--muted); }
@media (max-width: 860px) {
  .hero { display: flex; flex-direction: column; }
  .hero-in { order: 1; grid-template-columns: 1fr; padding-block: 24px 8px; }
  .hero-art { order: 2; position: relative; right: auto; top: auto; width: 100%; height: 260px; margin: 0 0 12px; }
}

/* ---------- panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font: 700 13px var(--font-display); color: var(--accent); }
.eyebrow::before { content: ""; width: 22px; height: 2px; background: var(--accent); border-radius: 2px; }

.skills { display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 28px; padding: 28px; align-items: center; margin-top: -14px; position: relative; z-index: 2; }

.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px 6px 12px; min-height: 92px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); text-align: center; font: 700 12px/1.2 var(--font-display); transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
.tile:hover { transform: translateY(-4px); border-color: var(--accent-2); box-shadow: 0 14px 22px -14px var(--accent); }
.tile .ico { width: 30px; height: 30px; color: var(--accent); transition: transform .3s ease; }
.tile:hover .ico { transform: scale(1.14) rotate(-4deg); }

@media (max-width: 960px) { .skills { grid-template-columns: 1fr; } .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.head { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; position: relative; }

/* projects */
.projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; margin-top: 24px; }

.card { overflow: hidden; display: flex; flex-direction: column; transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s ease-out, box-shadow .25s ease; will-change: transform; }
.card:hover { box-shadow: 0 26px 40px -22px rgba(10, 50, 160, .55); }

.feats li { display: flex; gap: 10px; font-size: 13px; line-height: 1.45; }

.feats i .ico { width: 11px; height: 11px; stroke-width: 3; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { padding: 3px 10px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); font: 600 11px var(--font-display); }
.card-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: auto; padding-top: 6px; }
.repo { font: 500 12px var(--font-mono); color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.tl-draw { stroke-dasharray: 400; stroke-dashoffset: 0; }
.thumb .car { stroke-dasharray: 700; animation: draw 2.4s ease-out both; }
.thumb .pkt { animation: pkt 3.2s linear infinite; }
@keyframes pkt { from { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } to { transform: translateX(160px); opacity: 0; } }
.thumb .lay { animation: lift 4.5s ease-in-out infinite; }
.thumb .lay:nth-child(2) { animation-delay: .35s; }
.thumb .lay:nth-child(3) { animation-delay: .7s; }
@keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

/* about + resume */
.duo { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 36px; align-items: center; }

.about { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 250px); gap: 22px; align-items: center; }

.col h3 { font: 800 15px var(--font-display); color: var(--accent); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
